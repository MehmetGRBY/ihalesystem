name: IhaleSystem checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s discovery -v
      - run: pytest --cov=tender_enricher --cov=system_bridge --cov=app --cov=system_operations --cov=system_backup --cov=system_state --cov-report=term-missing
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: node --check discovery/panel.js
      - run: tender-enricher schema && git diff --exit-code -- schemas
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest tests/test_desktop_launchers.py

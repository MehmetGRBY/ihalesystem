[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tender-enricher"
version = "0.1.0"
description = "Evidence-based enrichment of existing tender records"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "SQLAlchemy>=2.0,<3", "alembic>=1.14,<2",
  "beautifulsoup4>=4.12,<5", "lxml>=5,<7",
  "httpx>=0.28,<1", "tldextract>=5.1,<6", "playwright==1.63.0",
  "pypdf==6.20.0", "pymupdf==1.28.2", "filelock>=3,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.9", "mypy>=1.14", "types-beautifulsoup4"]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
tender-enricher = "tender_enricher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "discovery"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["discovery"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/tender_enricher"]

[[tool.mypy.overrides]]
module = ["tldextract.*"]
ignore_missing_imports = true
